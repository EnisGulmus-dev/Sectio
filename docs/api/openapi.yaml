      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {$ref: "#/components/schemas/TaskStatus"}

    Task:
      type: object
      required: [id, projectId, projectName, createdById, createdByName, assignees, title, status, priority, createdAt, updatedAt]
      properties:
