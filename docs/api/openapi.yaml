          type: string
          format: email
          maxLength: 255
        temporaryPassword:
          type: string
          format: password
          minLength: 12
          maxLength: 72
        role:
          type: string
          enum: [ADMIN, EMPLOYEE]
        jobTitle:
          $ref: "#/components/schemas/JobTitle"

    UpdateUserRequest:
      type: object
      additionalProperties: false
      required: [name, role, jobTitle]
      properties:
