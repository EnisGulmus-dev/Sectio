
openapi: 3.1.0
info:
  title: Sectio API
  version: 0.2.0
  description: Session-based API for the Sectio task management application.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Authentication
  - name: Admin Users
  - name: Projects
  - name: Tasks
  - name: Dashboard
  - name: Operations
paths:
  /actuator/health:
    get:
      tags: [Operations]
      summary: Check application health
      responses:
        "200":
          description: Application is healthy

  /api/v1/auth/csrf:
    get:
      tags: [Authentication]
      summary: Obtain a CSRF token
      description: >-
        Call before every authentication flow and again after login. Send the
        returned token in the X-XSRF-TOKEN header for state-changing requests.
      responses:
        "200":
          description: CSRF token created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfToken"

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Start an authenticated session
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session created
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/AccessDenied"

  /api/v1/auth/me:
    get:
      tags: [Authentication]
      summary: Return the authenticated user
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"

  /api/v1/auth/change-password:
    post:
      tags: [Authentication]
      summary: Change the current user's password
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed and mandatory-change flag cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: Validation, current-password or password-reuse failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/AccessDenied"

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: End the authenticated session
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204":
          description: Session invalidated and cookies cleared
        "403":
          $ref: "#/components/responses/AccessDenied"

  /api/v1/admin/users:
    get:
      tags: [Admin Users]
      summary: List users
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Users ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "403":
          $ref: "#/components/responses/AccessDenied"
    post:
      tags: [Admin Users]
      summary: Create a user with a temporary password
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "409":
          description: Email already exists

  /api/v1/admin/users/{userId}:
    patch:
      tags: [Admin Users]
      summary: Update a user's name and role
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "404":
          description: User not found
        "409":
          description: Self-role or last-admin protection rejected the request
    delete:
      tags: [Admin Users]
      summary: Permanently delete a user and related work assignments
      description: Self-deletion and deletion of a project owner are forbidden. Memberships and assignments are removed atomically; tasks with no remaining assignee and tasks created by the user are deleted.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204":
          description: User permanently deleted
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: User is the current admin or owns a project

  /api/v1/admin/users/{userId}/deletion-impact:
    get:
      tags: [Admin Users]
      summary: Preview records affected by permanent user deletion
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Deletion impact counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDeletionImpact"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/users/{userId}/status:
    patch:
      tags: [Admin Users]
      summary: Activate or deactivate a user
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeUserStatusRequest"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "409":
          description: Self-deactivation or last-admin protection rejected the request

  /api/v1/admin/users/{userId}/reset-password:
    post:
      tags: [Admin Users]
      summary: Set a temporary password and require a change at next login
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetUserPasswordRequest"
      responses:
        "200":
          description: Temporary password set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: Admin attempted to reset their own password through this endpoint

  /api/v1/projects:
    get:
      tags: [Projects]
      summary: List accessible projects
      security: [{sessionCookie: []}]
      parameters:
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Archived"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Projects visible to the current user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectPage"}
        "401": {$ref: "#/components/responses/AuthenticationRequired"}
    post:
      tags: [Projects]
      summary: Create a project
      description: Available to administrators and employees whose job title is TEAM_LEADER or MANAGER.
      security: [{sessionCookie: []}]
      parameters: [{$ref: "#/components/parameters/CsrfHeader"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProjectInput"}
      responses:
        "201":
          description: Project created; creator is owner and first member
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Project"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/AuthenticationRequired"}
        "403": {$ref: "#/components/responses/AccessDenied"}
  /api/v1/projects/{projectId}:
    get:
      tags: [Projects]
      summary: Get an accessible project
      security: [{sessionCookie: []}]
      parameters: [{$ref: "#/components/parameters/ProjectId"}]
      responses:
        "200":
          description: Project detail
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Project"}
        "401": {$ref: "#/components/responses/AuthenticationRequired"}
        "403": {$ref: "#/components/responses/AccessDenied"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [Projects]
      summary: Update a project
      description: Only an administrator or the project owner can update an active project.
      security: [{sessionCookie: []}]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProjectInput"}
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Project"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "403": {$ref: "#/components/responses/AccessDenied"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
    delete:
      tags: [Projects]
      summary: Permanently delete a project
      description: Deletes an active or archived project together with its tasks and memberships. This operation cannot be undone.
      security: [{sessionCookie: []}]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": {description: Project permanently deleted}
        "403": {$ref: "#/components/responses/AccessDenied"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/projects/{projectId}/archive:
    post:
      tags: [Projects]
      summary: Archive a project
      description: Archived projects remain readable but reject project, member and task mutations.
      security: [{sessionCookie: []}]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Project archived
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Project"}
        "403": {$ref: "#/components/responses/AccessDenied"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/projects/{projectId}/restore:
    post:
      tags: [Projects]
      summary: Restore an archived project
      description: Only an administrator or the project owner can restore a project.
      security: [{sessionCookie: []}]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Project restored and active again
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Project"}
        "403": {$ref: "#/components/responses/AccessDenied"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/projects/{projectId}/members:
    get:
      tags: [Projects]
      summary: List project members
      security: [{sessionCookie: []}]
      parameters: [{$ref: "#/components/parameters/ProjectId"}]
      responses:
        "200":
          description: Project members with the project owner pinned first, followed by name
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/ProjectMember"}
        "403": {$ref: "#/components/responses/AccessDenied"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      tags: [Projects]
      summary: Add project members
      description: Only an administrator or the project owner can add up to 50 active users atomically.
      security: [{sessionCookie: []}]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AddProjectMemberRequest"}
      responses:
        "201":
          description: Members added
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/ProjectMember"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "403": {$ref: "#/components/responses/AccessDenied"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/projects/{projectId}/members/{userId}:
    delete:
      tags: [Projects]
      summary: Remove a project member
      description: The project owner cannot be removed. An assignee can be removed only when all assigned tasks are DONE or CANCELLED.
      security: [{sessionCookie: []}]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": {description: Member removed}
        "403": {$ref: "#/components/responses/AccessDenied"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/projects/{projectId}/member-candidates:
    get:
      tags: [Projects]
      summary: List active users who can be added to a project
      security: [{sessionCookie: []}]
      parameters: [{$ref: "#/components/parameters/ProjectId"}]
      responses:
        "200":
          description: Active users who are not already members
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/ProjectMemberCandidate"}
        "403": {$ref: "#/components/responses/AccessDenied"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/projects/{projectId}/teams:
    get:
      tags: [Projects]
      summary: List project teams
      security: [{sessionCookie: []}]
      parameters: [{$ref: "#/components/parameters/ProjectId"}]
      responses:
        "200":
          description: Named project teams and their current members
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/ProjectTeam"}
        "403": {$ref: "#/components/responses/AccessDenied"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      tags: [Projects]
      summary: Create a project team
      security: [{sessionCookie: []}]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProjectTeamInput"}
      responses:
        "201":
          description: Team created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectTeam"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "403": {$ref: "#/components/responses/AccessDenied"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/projects/{projectId}/teams/{teamId}:
    patch:
      tags: [Projects]
      summary: Update a project team
      security: [{sessionCookie: []}]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - {name: teamId, in: path, required: true, schema: {type: integer, format: int64}}
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProjectTeamInput"}
      responses:
        "200":
          description: Team updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectTeam"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "403": {$ref: "#/components/responses/AccessDenied"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
    delete:
      tags: [Projects]
      summary: Delete a project team
      security: [{sessionCookie: []}]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - {name: teamId, in: path, required: true, schema: {type: integer, format: int64}}
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": {description: Team deleted; project members remain unchanged}
        "403": {$ref: "#/components/responses/AccessDenied"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/projects/{projectId}/tasks:
    get:
      tags: [Tasks]
      summary: List project tasks
      security: [{sessionCookie: []}]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/TaskStatusFilter"
        - $ref: "#/components/parameters/TaskPriorityFilter"
        - $ref: "#/components/parameters/AssigneeId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Filtered project tasks ordered by most recently updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaskPage"}
        "403": {$ref: "#/components/responses/AccessDenied"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      tags: [Tasks]
      summary: Create a project task
      security: [{sessionCookie: []}]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TaskInput"}
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "403": {$ref: "#/components/responses/AccessDenied"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/tasks/my:
    get:
      tags: [Tasks]
      summary: List tasks assigned to the current user
      security: [{sessionCookie: []}]
      parameters:
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/TaskStatusFilter"
        - $ref: "#/components/parameters/TaskPriorityFilter"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Filtered tasks assigned to the authenticated user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaskPage"}
        "401": {$ref: "#/components/responses/AuthenticationRequired"}
  /api/v1/tasks/{taskId}:
    get:
      tags: [Tasks]
      summary: Get a task
      security: [{sessionCookie: []}]
      parameters: [{$ref: "#/components/parameters/TaskId"}]
      responses:
        "200":
          description: Task detail
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        "403": {$ref: "#/components/responses/AccessDenied"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [Tasks]
      summary: Update a task
      security: [{sessionCookie: []}]
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TaskInput"}
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "403": {$ref: "#/components/responses/AccessDenied"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
    delete:
      tags: [Tasks]
      summary: Delete a task
      security: [{sessionCookie: []}]
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": {description: Task deleted}
        "403": {$ref: "#/components/responses/AccessDenied"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/tasks/{taskId}/status:
    patch:
      tags: [Tasks]
      summary: Change task status
      security: [{sessionCookie: []}]
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TaskStatusInput"}
      responses:
        "200":
          description: Task status updated; completedAt follows DONE status
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "403": {$ref: "#/components/responses/AccessDenied"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Get task counters
      security: [{sessionCookie: []}]
      responses:
        "200":
          description: System-wide totals for admins; assigned-task totals for employees
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DashboardSummary"}
        "401": {$ref: "#/components/responses/AuthenticationRequired"}

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID

  parameters:
    CsrfHeader:
      name: X-XSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
      description: Token returned by GET /api/v1/auth/csrf.
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    TaskId:
      name: taskId
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    Query:
      name: query
      in: query
      required: false
      schema: {type: string, default: ""}
    Archived:
      name: archived
      in: query
      required: false
      description: Omit to include both active and archived projects.
      schema: {type: boolean}
    TaskStatusFilter:
      name: status
      in: query
      required: false
      schema: {$ref: "#/components/schemas/TaskStatus"}
    TaskPriorityFilter:
      name: priority
      in: query
      required: false
      schema: {$ref: "#/components/schemas/TaskPriority"}
    AssigneeId:
      name: assigneeId
      in: query
      required: false
      schema: {type: integer, format: int64, minimum: 1}
    Page:
      name: page
      in: query
      required: false
      schema: {type: integer, minimum: 0, default: 0}
    Size:
      name: size
      in: query
      required: false
      description: Values are clamped to the range 1–100.
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}

  responses:
    AuthenticationRequired:
      description: No valid authenticated session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InvalidCredentials:
      description: Email or password is incorrect
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    AccessDenied:
      description: CSRF validation or authorization failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Requested project, task, member or user does not exist
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    Conflict:
      description: Operation violates project state, membership or assignment rules
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}

  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          maxLength: 72

    ChangePasswordRequest:
      type: object
      additionalProperties: false
