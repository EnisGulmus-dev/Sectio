
openapi: 3.1.0
info:
  title: Sectio API
  version: 0.1.0
  description: Session-based API for the Sectio task management application.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Authentication
  - name: Admin Users
  - name: Operations
paths:
  /actuator/health:
    get:
      tags: [Operations]
      summary: Check application health
      responses:
        "200":
          description: Application is healthy

  /api/v1/auth/csrf:
    get:
      tags: [Authentication]
      summary: Obtain a CSRF token
      description: >-
        Call before every authentication flow and again after login. Send the
        returned token in the X-XSRF-TOKEN header for state-changing requests.
      responses:
        "200":
          description: CSRF token created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfToken"

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Start an authenticated session
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session created
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/AccessDenied"

  /api/v1/auth/me:
    get:
      tags: [Authentication]
      summary: Return the authenticated user
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"

  /api/v1/auth/change-password:
    post:
      tags: [Authentication]
      summary: Change the current user's password
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed and mandatory-change flag cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: Validation, current-password or password-reuse failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/AccessDenied"

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: End the authenticated session
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204":
          description: Session invalidated and cookies cleared
        "403":
          $ref: "#/components/responses/AccessDenied"

  /api/v1/admin/users:
    get:
      tags: [Admin Users]
      summary: List users
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Users ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "403":
          $ref: "#/components/responses/AccessDenied"
    post:
      tags: [Admin Users]
      summary: Create a user with a temporary password
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "409":
          description: Email already exists

  /api/v1/admin/users/{userId}:
    patch:
      tags: [Admin Users]
      summary: Update a user's name and role
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "404":
          description: User not found
        "409":
          description: Self-role or last-admin protection rejected the request

  /api/v1/admin/users/{userId}/status:
    patch:
      tags: [Admin Users]
      summary: Activate or deactivate a user
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeUserStatusRequest"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "409":
          description: Self-deactivation or last-admin protection rejected the request

  /api/v1/admin/users/{userId}/reset-password:
    post:
      tags: [Admin Users]
      summary: Set a temporary password and require a change at next login
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetUserPasswordRequest"
      responses:
        "200":
          description: Temporary password set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: Admin attempted to reset their own password through this endpoint

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID

  parameters:
    CsrfHeader:
      name: X-XSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
      description: Token returned by GET /api/v1/auth/csrf.
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    AuthenticationRequired:
      description: No valid authenticated session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InvalidCredentials:
      description: Email or password is incorrect
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    AccessDenied:
      description: CSRF validation or authorization failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          maxLength: 72

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 12
          maxLength: 72

    CurrentUser:
      type: object
      required: [id, name, email, role, mustChangePassword]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [ADMIN, EMPLOYEE]
        mustChangePassword:
          type: boolean

    AdminUser:
      type: object
      required: [id, name, email, role, active, mustChangePassword, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [ADMIN, EMPLOYEE]
        active:
          type: boolean
        mustChangePassword:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [name, email, temporaryPassword, role]
      properties:
        name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 255
        temporaryPassword:
          type: string
          format: password
          minLength: 12
          maxLength: 72
        role:
          type: string
          enum: [ADMIN, EMPLOYEE]

    UpdateUserRequest:
      type: object
      additionalProperties: false
      required: [name, role]
      properties:
        name:
          type: string
          maxLength: 100
        role:
          type: string
          enum: [ADMIN, EMPLOYEE]

    ChangeUserStatusRequest:
      type: object
      additionalProperties: false
      required: [active]
      properties:
        active:
          type: boolean

    ResetUserPasswordRequest:
      type: object
      additionalProperties: false
      required: [temporaryPassword]
      properties:
        temporaryPassword:
          type: string
          format: password
          minLength: 12
          maxLength: 72

    CsrfToken:
      type: object
      required: [headerName, parameterName, token]
      properties:
        headerName:
          type: string
          example: X-XSRF-TOKEN
        parameterName:
          type: string
          example: _csrf
        token:
          type: string

    ApiError:
      type: object
      required: [code, message, fieldErrors]
      properties:
        code:
          type: string
        message:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
